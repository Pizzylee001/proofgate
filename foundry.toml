[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Official Attestcoin Protocol decoder library (npm: @gluwa/usc-contracts)
# npm v0.2.0 ships contracts under contracts/write-ability/
remappings = ["@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/contracts/write-ability/"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
