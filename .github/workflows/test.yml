name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # pinned: forge fmt output differs between foundry releases;
          # must match the local toolchain exactly
          version: v1.2.3

      - name: Show Forge version
        run: |
          forge --version

      - name: Install Node deps
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm ci
        run: npm ci

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  web-build:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node deps
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm ci and build
        run: |
          cd web
          npm ci
          npm run build
